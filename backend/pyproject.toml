[project]
name = "backend"
version = "0.1.0"
description = "Evidence-first organizational memory auditor backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose the model reads; wrapping it would change its meaning.
"app/reasoning/prompts.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
